# UrbanWatch — stack completa (app + PostgreSQL) para deploy/local.
# Uso:  JWT_SECRET="$(openssl rand -base64 48)" docker compose up -d --build
# App:  http://localhost:8080   ·   Swagger: /swagger-ui.html

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: urbanwatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - uw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/urbanwatch
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?defina a variavel JWT_SECRET}
    ports:
      - "8080:8080"

volumes:
  uw_pgdata:
