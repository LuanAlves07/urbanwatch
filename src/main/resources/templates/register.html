<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - SOS Urbano</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="stylesheet" th:href="@{/css/fragments.css}">
</head>
<body>
    <div th:replace="~{fragments :: menu-nav}"></div>

    <main class="register-page">
        <section class="register-layout" aria-label="Criacao de conta">
            <aside class="register-side register-side--left">
                <div class="register-aside">
                    <h2>Ja possui uma conta?</h2>
                    <p>Realize o login agora!</p>
                    <a th:href="@{/login}" class="aside-button">Entrar</a>
                </div>
            </aside>

            <div class="register-side register-side--right">
                <div class="register-card">
                    <form class="register-form" action="#" method="post">
                        <h1>Bem-vindo(a)</h1>

                        <label for="name">Nome completo</label>
                        <input id="name" name="name" type="text" placeholder="Ex.: Joao da Silva Mota" autocomplete="name">

                        <label for="email">E-mail</label>
                        <input id="email" name="email" type="email" placeholder="seuemail@email.com" autocomplete="email">

                        <label for="password">Senha</label>
                        <input id="password" name="password" type="password" placeholder="************************" autocomplete="new-password">

                        <label for="confirmPassword">Repetir Senha</label>
                        <input id="confirmPassword" name="confirmPassword" type="password" placeholder="************************" autocomplete="new-password">
                        <span class="error-text hidden">*As senhas não correspondem*</span>

                        <button type="submit" class="hover-bright">Registrar</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script th:src="@{/js/register.js}"></script>
</body>
</html>
