spring.application.name=UrbanWatch

spring.datasource.url=jdbc:postgresql://localhost:5432/urbanwatch
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=urbanwatch-development-secret-key-change-before-production-1234567890
jwt.expiration-ms=86400000

spring.thymeleaf.cache=false

spring.devtools.restart.additional-paths=src/main/resources/templates,src/main/resources/static