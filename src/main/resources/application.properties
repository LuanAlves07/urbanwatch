spring.application.name=UrbanWatch

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urbanwatch}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html

# Segredo do JWT: obrigatorio via variavel de ambiente (sem fallback no repo).
# Para rodar localmente: export JWT_SECRET="$(openssl rand -base64 48)"
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:10MB}

spring.thymeleaf.cache=false

spring.devtools.restart.additional-paths=src/main/resources/templates,src/main/resources/static